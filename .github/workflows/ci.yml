name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19.0
          - 22.12.0
          - 24.x

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  # The browser image has to match the Playwright version in the lockfile, so the tag is read from it.
  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the version from the lockfile
        id: read
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

  browser:
    name: Browsers
    needs: playwright-version
    runs-on: ubuntu-latest
    # Playwright's image already holds Chromium, Firefox, WebKit, and their system libraries,
    # so a run downloads no browsers and installs nothing with apt.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Firefox refuses to start as root, the image's default user.
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test in Chromium, Firefox, and WebKit
        run: npm run test:browser
