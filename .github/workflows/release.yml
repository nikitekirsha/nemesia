name: Release

# Publishes the version named by a pushed tag, with provenance that links the package to this commit.
# npm authenticates the workflow itself (trusted publishing), so the repository holds no npm token.
on:
  push:
    tags:
      - v*

permissions:
  contents: read

# Two releases never run at once, and a release that has started is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          # A release installs everything fresh, so a poisoned cache can never end up in the package.
          package-manager-cache: false

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@latest

      # `prepack` checks formatting, runs the tests, and builds before anything is uploaded.
      - name: Publish
        run: npm publish --provenance --access public

  # Runs only after the package is on npm. It is a separate job so that the permission to write releases
  # never goes to the job that publishes the package.
  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          package-manager-cache: false

      # The notes are the version's section of CHANGELOG.md, or the commits since the last release when there is none.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists"
            exit 0
          fi

          if node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > notes.md; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi

          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --latest "${notes[@]}"
